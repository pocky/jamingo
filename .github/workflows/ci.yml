name: CI and release

'on':
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jamingo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verify:
    name: Test and package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Validate package metadata
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            python3 scripts/check-package.py --tag "$GITHUB_REF_NAME"
          else
            python3 scripts/check-package.py
          fi
          version=$(node -p 'require("./package.json").version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Test in Chromium
        run: npm run test:browser
      - name: Build and verify extension archive
        run: |
          make zip
          python3 -m unittest discover -s tests -p 'test_package.py'
      - name: Upload installable ZIP and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jamingo-${{ steps.version.outputs.version }}
          path: |
            dist/jamingo.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-diagnostics
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish versioned download
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jamingo-${{ needs.verify.outputs.version }}
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "Jamingo $RELEASE_VERSION" \
            --generate-notes \
            dist/jamingo.zip dist/SHA256SUMS
